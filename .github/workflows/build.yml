name: build-courses
on:
  schedule:
    - cron: "0 */6 * * *"    # every 6 hours (GitHub's servers, no app needed)
  workflow_dispatch: {}
concurrency:
  group: course-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install rasterio || echo "rasterio unavailable — Scotland LIDAR skipped, SRTM fallback used"
      - name: Build courses (time-budgeted, resumable)
        env:
          TIME_BUDGET: "18000"
        run: python cloud_autopilot.py
      - name: Commit progress
        if: always()
        run: |
          git config user.name "golf-builder"
          git config user.email "actions@github.com"
          git add terrain courses state.json build_log.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            n=$(ls terrain 2>/dev/null | wc -l)
            git commit -m "build: course terrain + sims (${n} total)"
            git pull --rebase --autostash origin master || true
            git push origin HEAD:master
          else
            echo "no new courses this run"
          fi
